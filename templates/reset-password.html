<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Reset Password - SevaSetu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(5, 20, 45, 0.72),
                    rgba(10, 40, 80, 0.78)
                ),
                url("https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            overflow: hidden;
        }

        /* Floating Background */

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            animation: float 8s infinite ease-in-out;
        }

        .circle.one {
            width: 180px;
            height: 180px;
            top: 7%;
            left: 7%;
        }

        .circle.two {
            width: 130px;
            height: 130px;
            bottom: 10%;
            right: 8%;
            animation-delay: 2s;
        }

        .circle.three {
            width: 65px;
            height: 65px;
            top: 18%;
            right: 18%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }
        }

        /* Main Card */

        .reset-card {
            position: relative;
            width: 430px;
            padding: 42px 40px;

            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(15px);

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            animation: cardShow 0.8s ease;

            z-index: 5;
        }

        @keyframes cardShow {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Lock Icon */

        .lock-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #2864e8,
                #6b8cff
            );

            border-radius: 50%;

            font-size: 34px;

            box-shadow:
                0 10px 25px rgba(40, 100, 232, 0.35);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        h1 {
            text-align: center;
            color: #2864e8;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Input */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;

            color: #333;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;

            left: 16px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;
        }

        input {
            width: 100%;

            padding: 16px 16px 16px 48px;

            border: 1px solid #ddd;
            border-radius: 12px;

            outline: none;

            font-size: 16px;

            background: #fafafa;

            transition: 0.3s;
        }

        input:focus {
            border-color: #2864e8;

            background: white;

            box-shadow:
                0 0 0 4px rgba(40, 100, 232, 0.12);

            transform: translateY(-2px);
        }

        /* Reset Button */

        .reset-btn {
            width: 100%;

            padding: 16px;

            margin-top: 4px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                90deg,
                #2864e8,
                #5c7cff,
                #2864e8
            );

            background-size: 200% auto;

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .reset-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(40, 100, 232, 0.35);
        }

        .reset-btn:active {
            transform: scale(0.98);
        }

        /* Password Rules */

        .password-info {
            margin-top: 18px;
            padding: 12px 15px;

            background: #f4f7ff;

            border-radius: 10px;

            font-size: 12px;
            color: #666;

            line-height: 1.6;
        }

        .password-info strong {
            color: #2864e8;
        }

        /* Back Login */

        .back-login {
            text-align: center;
            margin-top: 22px;
        }

        .back-login a {
            color: #2864e8;

            text-decoration: none;

            font-weight: 600;

            transition: 0.3s;
        }

        .back-login a:hover {
            color: #174bbd;
            letter-spacing: 0.3px;
        }

        /* Security */

        .security {
            text-align: center;

            margin-top: 20px;

            font-size: 12px;
            color: #777;
        }

        /* Mobile */

        @media (max-width: 500px) {

            .reset-card {
                width: 90%;
                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <!-- Animated Background -->

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>


    <!-- Reset Password Card -->

    <div class="reset-card">

        <div class="lock-icon">
            🔐
        </div>

        <h1>Reset Password</h1>

        <p class="subtitle">
            Create a new secure password for your account.
        </p>


        <form method="POST">

            <!-- New Password -->

            <div class="input-group">

                <label>New Password</label>

                <div class="input-box">

                    <span>🔑</span>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter new password"
                        minlength="8"
                        required
                    >

                </div>

            </div>


            <!-- Confirm Password -->

            <div class="input-group">

                <label>Confirm Password</label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >

                </div>

            </div>


            <button type="submit" class="reset-btn">
                🔄 Reset Password
            </button>

        </form>


        <div class="password-info">
            <strong>Password Tips</strong><br>
            • Use at least 8 characters<br>
            • Use a combination of letters and numbers<br>
            • Avoid using easily guessed passwords
        </div>


        <div class="back-login">
            <a href="/login">
                ← Back to Login
            </a>
        </div>


        <div class="security">
            🔒 Your new password is securely protected
        </div>

    </div>

</body>
</html>
